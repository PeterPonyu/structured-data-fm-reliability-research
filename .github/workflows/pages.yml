name: Deploy companion Pages

on:
  push:
    branches: [pages/structure-companion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-structure-companion
  cancel-in-progress: false

jobs:
  extract-hash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hash frozen extracts
        run: |
          if compgen -G "site/data/*" > /dev/null; then
            find site/data -type f | sort | xargs sha256sum
          else
            echo "no extracts yet"
          fi

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Stamp docs/
        run: python site/build.py

      - name: Leak/allowlist scan
        run: |
          python - <<'PY'
          from pathlib import Path
          needles = (
              "/home/",
              "/root/",
              "checkpoint-",
              "F1_debt",
              "peaceiris",
              "Matbench",
              "MVTec",
              "paper_rie",
              "inspect-gate",
              "asr-gate",
              "manuscripts/",
              "paper_kbs.pdf",
              "@gmail.com",
              "fuzeyu09",
              "KBS",
              "DMKD",
              "Knowledge-Based",
              "this paper",
              "the paper",
              "manuscript",
              "submitted",
              "journal",
              "InfoSci",
              "Paper companion",
              "Print PDF",
              "Thesis",
              "unpublished",
              "SOTA",
              "REJECT",
              "CONFIRM",
              "KILL",
              "13/14",
              "H1 coverage",
              "Same frozen numbers",
              "verdict-reject",
              "Science Gateway",
              "Launch Explorer",
              "flagship",
              "AURC",
          )
          problems = []
          root = Path("docs")
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".css", ".js", ".md", ".csv"}:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              rel = str(path.relative_to(root))
              for needle in needles:
                  if needle in text:
                      problems.append(f"{rel}: {needle}")
          if (root / "paper_kbs.pdf").exists() or list(root.glob("paper_*.pdf")):
              problems.append("paper_*.pdf in Pages artifact")
          fig = root / "figures"
          if fig.is_dir() and (
              list(fig.glob("*.png")) or list(fig.glob("*.pdf")) or list(fig.glob("*.svg"))
          ):
              problems.append("figure binaries in docs/figures")
          data = root / "data"
          if data.is_dir() and any(data.iterdir()):
              problems.append("table extracts in docs/data")
          if problems:
              raise SystemExit("leak scan failed:\n  " + "\n  ".join(problems))
          print("leak scan: ok")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/pages/structure-companion' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, extract-hash]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
